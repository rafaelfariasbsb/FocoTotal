name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Versão
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = '0.1.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Testes
        run: dotnet test tests/FocoTotal.Core.Tests -c Release

      - name: Publicar serviço e app, gerar MSI
        shell: pwsh
        run: ./scripts/build.ps1 -Version ${{ steps.ver.outputs.version }}

      # MSI sem assinatura: usado nos builds comuns e enviado para a SignPath nas versões (tags v*).
      - name: Enviar MSI sem assinatura
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: FocoTotal-${{ steps.ver.outputs.version }}-sem-assinatura
          path: artifacts/*.msi

      # Assinatura pela SignPath Foundation. Só roda em tags v* e depois que os
      # dados da SignPath forem cadastrados no repositório (veja docs/assinatura.md).
      - name: Assinar pela SignPath
        id: sign
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'FocoTotal' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: "${{ steps.ver.outputs.version }}"

      - name: Enviar MSI assinado
        if: steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FocoTotal-${{ steps.ver.outputs.version }}
          path: signed/*.msi

      # A página de download precisa citar a política de assinatura (exigência da SignPath).
      - name: Notas da versão
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ('${{ steps.sign.outcome }}' -eq 'success') {
            $sig = 'This MSI and the executables inside it are signed. / Este MSI e os executáveis dentro dele são assinados.'
          } else {
            $sig = 'This release is not signed yet: signing starts once the SignPath Foundation approves the project. / Esta versão ainda não é assinada: a assinatura começa quando a SignPath Foundation aprovar o projeto.'
          }
          (Get-Content .github/release-notes.md -Raw).Replace('{{VERSION}}', '${{ steps.ver.outputs.version }}').Replace('{{SIGNATURE}}', $sig) |
            Set-Content release-notes.md -Encoding utf8

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: ${{ steps.sign.outcome == 'success' && 'signed/*.msi' || 'artifacts/*.msi' }}
