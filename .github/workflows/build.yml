name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Versão
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = '0.1.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Testes
        run: dotnet test tests/FocoTotal.Core.Tests -c Release

      - name: Publicar serviço e app
        shell: pwsh
        run: ./scripts/build.ps1 -Version ${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: FocoTotal-${{ steps.ver.outputs.version }}
          path: artifacts/*.msi

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.msi
